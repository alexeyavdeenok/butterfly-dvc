schema: '2.0'
stages:
  train_cnn:
    cmd: python src/train.py --model cnn --config params/experiments.yaml 
      --run-name cnn_baseline
    deps:
    - path: data/processed/manifest.csv
      hash: md5
      md5: c4642e77b2a52aeb8bfc44d02a1ecf93
      size: 1864614
    - path: src/image_dataset.py
      hash: md5
      md5: 502264fbd6b2bb4703335021a9270a46
      size: 5780
    - path: src/models.py
      hash: md5
      md5: 514ded64ee1a30a100122ae6f5ba9d87
      size: 3616
    - path: src/train.py
      hash: md5
      md5: 6e94fb2f21c63a74a73e86eb61607f1c
      size: 13378
    params:
      params/experiments.yaml:
        data:
          manifest: data/processed/manifest.csv
          image_size: 224
          batch_size: 32
          augmentation: false
          augmented_dir: data/augmented
        evaluation:
          validation_split: valid
          test_split: test
        models:
          cnn:
            enabled: true
          mobilenetv2:
            enabled: true
          efficientnetb0:
            enabled: true
        seed: 42
        training:
          epochs: 10
          learning_rate: 0.001
          dropout: 0.3
          early_stopping_patience: 3
    outs:
    - path: models/cnn_baseline/best.keras
      hash: md5
